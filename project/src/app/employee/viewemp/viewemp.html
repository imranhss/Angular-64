<div class="container mt-4" *ngIf="emp">
  <div class="card">
    <div class="card-body">
      <h2>Name {{ emp.name }}</h2>
      <p><strong>Salary:</strong> {{ emp.salary }}</p>
      <p><strong>Email:</strong> {{ emp.email }}</p>
      <p><strong>Gender:</strong> {{ emp.gender }}</p>
      <p><strong>Country:</strong> {{ getCountryName(emp.country) }}</p>
      <p><strong>Division:</strong> {{ getDivisionName(emp.division) }}</p>
      <p><strong>District:</strong> {{ getDistrictName(emp.district) }}</p>
      <p><strong>Police Station:</strong> {{ getPoliceStationName(emp.policeStation) }}</p>
    </div>
  </div>
</div>
