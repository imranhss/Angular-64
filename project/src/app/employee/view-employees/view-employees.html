<div class="container mt-4">
  <h2 class="mb-4">All Employees</h2>

  <div class="row">
    <div
      class="col-md-4 mb-4"
      *ngFor="let emp of employees"
    >
      <div class="card shadow h-100">
        <div class="card-body">
          <h5 class="card-title">Name: {{ emp.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">Email: {{ emp.email }}</h6>

          <p class="card-text mb-1">
            <strong>Salary:</strong> {{ emp.salary | currency }}
          </p>
          <p class="card-text mb-1">
            <strong>Country:</strong> {{ getCountryName(emp.country) }}
          </p>
          <p class="card-text mb-1">
            <strong>Division:</strong> {{ getDivisionName(emp.division) }}
          </p>
          <p class="card-text mb-1">
            <strong>District:</strong> {{ getDistrictName(emp.district) }}
          </p>
          <p class="card-text mb-1">
            <strong>Police Station:</strong> {{ getPoliceStationName(emp.policeStation) }}
          </p>
        </div>
        <div class="card-footer text-end">
          <button class="btn btn-sm btn-warning me-2">Edit</button>
          <button class="btn btn-sm btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
